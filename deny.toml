# `cargo deny check advisories bans licenses`, run by CI.

[graph]
all-features = true

[advisories]
# Any other advisory, unmaintained crates included, fails the check.
ignore = [
    # bincode 1 is unmaintained, its authors calling 1.3.3 complete; it only encodes proofs for tests and the CLI.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is final; proofs only, in tests and the CLI" },
    # ansi_term is unmaintained; tracing-forest pulls it for the benchmark span tree, which the prover never links.
    { id = "RUSTSEC-2021-0139", reason = "tracing-forest's colors, benchmarks only" },
]

[bans]
multiple-versions = "allow"
# `leanvm` reaches the other crates by path, which a wildcard check would flag; registry versions are pinned by the lockfile.
wildcards = "allow"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[licenses.private]
# The unpublished crates (all but `leanvm`) are the workspace's own.
ignore = true
