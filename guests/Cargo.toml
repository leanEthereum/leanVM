# RISC-V guests of leanVM: their own workspace, since they build for another target.
[workspace]
resolver = "3"
members = ["rt", "fibonacci", "blake2s", "hash", "numbers", "preimage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
opt-level = 3
panic = "abort"
lto = true
codegen-units = 1
