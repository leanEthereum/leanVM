# libFuzzer over the `fuzz` crate's targets: coverage-guided, nightly only. `README.md` in `crates/fuzz` says how to run it.
[package]
name = "leanvm-libfuzzer"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fuzz = { path = "../crates/fuzz" }

# Not a member of the repository's workspace.
[workspace]
members = ["."]

[profile.release]
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

