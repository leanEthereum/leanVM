name: Native Plonky3 stack measurements
on:
  push:
    branches: [perf/plonky3-stack-measurements]
permissions:
  contents: read
jobs:
  measure:
    name: Strided ARM coordinate-load comparison
    runs-on: [size-attester7870-arm64, self-hosted-ghr]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Plonky3/Plonky3
          ref: 34e38d3db576d79eec90b7495d0ca5953553a10b
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare strided coordinate loads and their product sums
        run: bash .github/perf-stack/run.sh
