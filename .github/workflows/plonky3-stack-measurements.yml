name: Native Plonky3 stack measurements
on:
  push:
    branches: [perf/plonky3-stack-measurements]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: [size-attester7870-x64, self-hosted-ghr]
          - name: arm64
            runner: [size-attester7870-arm64, self-hosted-ghr]
    name: Branch-free radix-eight comparison (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Plonky3/Plonky3
          ref: b83a7df2cd3d45b0cb7885cc53f845a1099aaf65
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare branch-free upstream butterflies on native hardware
        run: bash .github/perf-stack/run.sh
