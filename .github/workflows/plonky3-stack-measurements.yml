name: Native Plonky3 stack measurements
on:
  push:
    branches: [perf/plonky3-stack-measurements]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: [size-attester7870-x64, self-hosted-ghr]
          - name: arm64
            runner: [size-attester7870-arm64, self-hosted-ghr]
    name: Coordinate gather comparison (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Plonky3/Plonky3
          ref: 2763bc8b5f1b5a809837b6ec31835cc420c4e0bf
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare coordinate gathers and loaded product sums on native hardware
        run: bash .github/perf-stack/run.sh
