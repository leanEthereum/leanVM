name: Native Plonky3 stack measurements
on:
  push:
    branches: [perf/plonky3-stack-measurements]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: [size-attester7870-x64, self-hosted-ghr]
          - name: arm64
            runner: [size-attester7870-arm64, self-hosted-ghr]
    name: Corrected scalar folding comparison (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Plonky3/Plonky3
          ref: 41812cb5ced23e3b9ff63304c942b4519b8db49d
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare corrected scalar folding with a known answer on native hardware
        run: bash .github/perf-stack/run.sh
