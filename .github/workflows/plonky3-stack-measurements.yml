name: Native Plonky3 stack measurements
on:
  push:
    branches: [perf/plonky3-stack-measurements]
permissions:
  contents: read
jobs:
  measure:
    name: Scalar ARM Karatsuba comparison
    runs-on: [size-attester7870-arm64, self-hosted-ghr]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Plonky3/Plonky3
          ref: 5bb6830ee4e7326bc6e7b4c142575f71e4c0970d
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare scalar scheduling in register chains and array sweeps
        run: bash .github/perf-stack/run.sh
