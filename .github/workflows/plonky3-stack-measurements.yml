name: Native Plonky3 stack measurements
on:
  push:
    branches: [perf/plonky3-stack-measurements]
permissions:
  contents: read
jobs:
  profile:
    name: Native ARM proof function profiles
    runs-on: [size-attester7870-arm64, self-hosted-ghr]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Profile the first round and GKR on both implementations
        run: |
          cp .github/perf-stack/profile-proof.sh /tmp/profile-proof.sh
          bash /tmp/profile-proof.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arm-proof-function-profiles
          path: /tmp/leanvm-profiles
