name: Native Plonky3 stack measurements
on:
  push:
    branches: [perf/plonky3-stack-measurements]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: [size-attester7870-x64, self-hosted-ghr]
          - name: arm64
            runner: [size-attester7870-arm64, self-hosted-ghr]
    name: Bounded generator weighting comparison (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Plonky3/Plonky3
          ref: d6f5a27384573d96419e056deeaff2c86d27f54f
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare bounded generator-weighting loop on native hardware
        run: bash .github/perf-stack/run.sh
