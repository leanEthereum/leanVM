name: Native Plonky3 stack measurements
on:
  push:
    branches: [perf/plonky3-stack-measurements]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: [size-attester7870-x64, self-hosted-ghr]
          - name: arm64
            runner: [size-attester7870-arm64, self-hosted-ghr]
    name: Packed cubic schedule comparison (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Plonky3/Plonky3
          ref: 978ce83ac549800999d817497330f53b50d2ce56
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare packed cubic product schedules on native hardware
        run: bash .github/perf-stack/run.sh
