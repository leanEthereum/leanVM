name: Native Plonky3 stack measurements
on:
  push:
    branches: [perf/plonky3-stack-measurements]
permissions:
  contents: read
jobs:
  measure:
    name: Byte-extension adapter inlining comparison (arm64)
    runs-on: [size-attester7870-arm64, self-hosted-ghr]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare the byte adapter in full proofs
        run: |
          cp .github/perf-stack/run-inline-byte.sh /tmp/run-inline-byte.sh
          bash /tmp/run-inline-byte.sh
