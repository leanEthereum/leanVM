name: Website

# Publishes doc/site/ (leanvm.org) to GitHub Pages on every push to main that changes it.

on:
  push:
    branches: [ main ]
    paths: [ 'doc/site/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'leanEthereum/leanVM'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
