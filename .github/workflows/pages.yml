name: Website

# Publishes doc/site/ (leanvm.org) to GitHub Pages on every push to main that changes it, and with
# the Go module proxy when bindings-release.yml dispatches it after a release.

on:
  push:
    branches: [ main ]
    paths: [ 'doc/site/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'leanEthereum/leanVM'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The Go module leanvm.org/go (doc/site/go/index.html): every version's proxy files, from the
      # release assets of every bindings-vX.Y.Z release, so the archives they hold never enter git.
      # Every deploy replaces the whole site, so each one rebuilds this from all releases.
      - name: Add the Go module proxy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=doc/site/goproxy/leanvm.org/go/@v
          mkdir -p "$versions"
          gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName -q '.[].tagName' | { grep '^bindings-v' || true; } | while read -r tag; do
            version=v${tag#bindings-v}
            gh release download "$tag" -R "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/$tag" --pattern 'go-module-*' || continue
            for ext in info mod zip; do
              [ -f "$RUNNER_TEMP/$tag/go-module-$version.$ext" ] || continue 2
            done
            for ext in info mod zip; do
              mv "$RUNNER_TEMP/$tag/go-module-$version.$ext" "$versions/$version.$ext"
            done
            echo "$version" >> "$versions/list"
          done
          touch "$versions/list"
          cat "$versions/list"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
