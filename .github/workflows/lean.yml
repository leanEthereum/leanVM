name: Lean

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sphincs-formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake formal/sphincs | grep -vE ':[0-9]+: *(--|/-)'
      # Without Mathlib's build, which `lake exe cache get` fetches, an entry takes
      # a small share of the repository's cache. Only `main` saves one; every
      # branch restores it, and GitHub drops it after a week unused.
      - name: Restore the Lake build
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            formal/sphincs/.lake
            !formal/sphincs/.lake/packages/mathlib/.lake
          key: lake-sphincs-${{ runner.os }}-${{ hashFiles('formal/sphincs/lean-toolchain', 'formal/sphincs/lake-manifest.json') }}-${{ hashFiles('formal/sphincs/**/*.lean') }}
          restore-keys: lake-sphincs-${{ runner.os }}-${{ hashFiles('formal/sphincs/lean-toolchain', 'formal/sphincs/lake-manifest.json') }}-
      # Each kernel-checked table (`decide +kernel`) takes most of the runner's
      # memory, so it is built alone, before Lake builds the rest in parallel,
      # with some swap as margin.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /swapfile.lean
          sudo chmod 600 /swapfile.lean
          sudo mkswap /swapfile.lean
          sudo swapon /swapfile.lean
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/sphincs
          use-github-cache: false
          build: false
      - name: Build the kernel tables one at a time
        working-directory: formal/sphincs
        run: |
          for m in Sphincs.H0FTab Sphincs.H0PTab Sphincs.H0NTab Sphincs.LifetimeCertificates; do
            lake build "$m"
          done
      - name: Build
        working-directory: formal/sphincs
        run: lake build
      - name: Check the axiom footprint
        working-directory: formal/sphincs
        run: |
          printf 'import Sphincs\n#print axioms Sphincs.Lifetimes.requestedSecurity\n' \
            > "$RUNNER_TEMP/axioms.lean"
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          grep -qF "'Sphincs.Lifetimes.requestedSecurity' depends on axioms: [propext, Classical.choice, Quot.sound]" \
            "$RUNNER_TEMP/axioms.txt"
      - name: Save the Lake build
        if: github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            formal/sphincs/.lake
            !formal/sphincs/.lake/packages/mathlib/.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: sphincs-axioms
          path: ${{ runner.temp }}/axioms.txt
