name: Lean

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-xmss-formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cheap first pass: the axiom guard in `XmssSecurity.lean` catches a `sorry`
      # or a `native_decide` reaching the root theorem, this catches one parked
      # anywhere in the project.
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake formal/lean_xmss | grep -vE ':[0-9]+: *(--|/-)'
      # Installs the toolchain from `formal/lean_xmss/lean-toolchain`, fetches the
      # mathlib cache, and runs `lake build` on the default targets, which
      # elaborate the root module and with it the `#guard_msgs` check. The
      # checked-in manifest is used as is: no `lake update`.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean_xmss
      # Lake replays a cached module's warnings, so a second build lists every one.
      - name: Forbid deprecated API
        working-directory: formal/lean_xmss
        run: |
          lake build 2>&1 | tee "$RUNNER_TEMP/build.log"
          ! grep -E '^warning: (LeanXmss|XmssSecurity).*has been deprecated' "$RUNNER_TEMP/build.log"
      # The root module guards its own footprint with `#guard_msgs`, which an
      # edit to the expected message would silence. This asks again from
      # outside, against the list written here.
      - name: Check the axiom footprint
        working-directory: formal/lean_xmss
        run: |
          printf 'import XmssSecurity\n#print axioms XmssSecurity.leanXmss_has_127_bits_of_classical_security\n' \
            > "$RUNNER_TEMP/axioms.lean"
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          grep -qF "'XmssSecurity.leanXmss_has_127_bits_of_classical_security' depends on axioms: [propext, Classical.choice, Quot.sound]" \
            "$RUNNER_TEMP/axioms.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: lean-xmss-axioms
          path: ${{ runner.temp }}/axioms.txt

  lean-sphincs-formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake formal/lean_sphincs | grep -vE ':[0-9]+: *(--|/-)'
      # Without Mathlib's build, which `lake exe cache get` fetches, an entry takes
      # a small share of the repository's cache. Only `main` saves one; every
      # branch restores it, and GitHub drops it after a week unused.
      - name: Restore the Lake build
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            formal/lean_sphincs/.lake
            !formal/lean_sphincs/.lake/packages/mathlib/.lake
          key: lake-lean-sphincs-${{ runner.os }}-${{ hashFiles('formal/lean_sphincs/lean-toolchain', 'formal/lean_sphincs/lake-manifest.json') }}-${{ hashFiles('formal/lean_sphincs/**/*.lean') }}
          restore-keys: lake-lean-sphincs-${{ runner.os }}-${{ hashFiles('formal/lean_sphincs/lean-toolchain', 'formal/lean_sphincs/lake-manifest.json') }}-
      # Each kernel-checked table (`decide +kernel`) is built alone, before Lake
      # builds the rest in parallel. The largest needs more than the runner's
      # memory, so the swap goes on the runner's scratch disk, which has room.
      - name: Add swap
        run: |
          dir=/mnt; [ -d /mnt ] || dir=/
          sudo fallocate -l 16G "$dir/swapfile.lean"
          sudo chmod 600 "$dir/swapfile.lean"
          sudo mkswap "$dir/swapfile.lean"
          sudo swapon "$dir/swapfile.lean"
          free -g
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean_sphincs
          use-github-cache: false
          build: false
      - name: Build the kernel tables one at a time
        working-directory: formal/lean_sphincs
        run: |
          for m in Sphincs.H0FTab Sphincs.H0PTab Sphincs.H0NTab Sphincs.LifetimeCertificates; do
            lake build "$m"
          done
      - name: Build
        working-directory: formal/lean_sphincs
        run: lake build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Forbid deprecated API
        run: "! grep -E '^warning: Sphincs(Fors|Base)?/.*has been deprecated' \"$RUNNER_TEMP/build.log\""
      - name: Check the axiom footprint
        working-directory: formal/lean_sphincs
        run: |
          printf 'import Sphincs\n#print axioms Sphincs.Lifetimes.requestedSecurity\n' \
            > "$RUNNER_TEMP/axioms.lean"
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          grep -qF "'Sphincs.Lifetimes.requestedSecurity' depends on axioms: [propext, Classical.choice, Quot.sound]" \
            "$RUNNER_TEMP/axioms.txt"
      - name: Save the Lake build
        if: github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            formal/lean_sphincs/.lake
            !formal/lean_sphincs/.lake/packages/mathlib/.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: lean-sphincs-axioms
          path: ${{ runner.temp }}/axioms.txt

  lean-da-formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake formal/lean_da | grep -vE ':[0-9]+: *(--|/-)'
      # As for sphincs: VCVio and CompPoly build from source, so `main` saves the Lake build,
      # without Mathlib's, which `lake exe cache get` fetches.
      - name: Restore the Lake build
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            formal/lean_da/.lake
            !formal/lean_da/.lake/packages/mathlib/.lake
          key: lake-lean-da-${{ runner.os }}-${{ hashFiles('formal/lean_da/lean-toolchain', 'formal/lean_da/lake-manifest.json') }}-${{ hashFiles('formal/lean_da/**/*.lean') }}
          restore-keys: lake-lean-da-${{ runner.os }}-${{ hashFiles('formal/lean_da/lean-toolchain', 'formal/lean_da/lake-manifest.json') }}-
      # Builds the default target, whose root module checks the front-page theorems' axioms with
      # `#guard_msgs`.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean_da
          use-github-cache: false
      # Lake replays a cached module's warnings, so a second build lists every one.
      - name: Forbid deprecated API
        working-directory: formal/lean_da
        run: |
          lake build 2>&1 | tee "$RUNNER_TEMP/build.log"
          ! grep -E '^warning: (LeanDa|PqDas).*has been deprecated' "$RUNNER_TEMP/build.log"
      - name: Check the axiom footprint
        working-directory: formal/lean_da
        run: |
          theorems="LeanDa.leanDa_perfectlyComplete LeanDa.leanDa_positionBinding LeanDa.leanDa_codeBinding LeanDa.checker_sound LeanDa.commitCodewords_eq_commitCells"
          { echo 'import LeanDa'; for t in $theorems; do echo "#print axioms $t"; done; } > "$RUNNER_TEMP/axioms.lean"
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          for t in $theorems; do
            grep -qF "'$t' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/axioms.txt"
          done
      - name: Save the Lake build
        if: github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            formal/lean_da/.lake
            !formal/lean_da/.lake/packages/mathlib/.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: lean-da-axioms
          path: ${{ runner.temp }}/axioms.txt

  # `formal/lean_vm` models the verifier, the guest and the prover's proofs, and imports the two
  # signature schemes and LeanDA, so a change to any of them re-checks it. A skipped job counts as
  # passed for branch protection.
  lean-vm-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || ! git fetch --quiet --depth=1 origin "$BASE"; then
            echo changed=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD -- formal/lean_vm crates/verifier python-verifier \
              crates/rec_aggregation crates/signatures crates/lean_compiler crates/leanvm_core crates/lean_da \
              formal/lean_xmss/LeanXmss/Scheme.lean \
              formal/lean_sphincs/Sphincs/Scheme.lean formal/lean_da/LeanDa/Scheme.lean formal/lean_da/LeanDa/Field.lean \
              .github/workflows/lean.yml | grep -q .; then
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

  lean-vm-formalization:
    needs: lean-vm-changes
    if: needs.lean-vm-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # A build from a cold cache is several CPU-hours of kernel checks, built two modules at a time.
    timeout-minutes: 360
    defaults:
      run:
        working-directory: formal/lean_vm
    steps:
      - uses: actions/checkout@v4
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake . | grep -vE ':[0-9]+: *(--|/-)'
      # `LeanVM/Spec/` is what is proved: it must not import the proofs.
      - name: Keep the specification apart from the proofs
        run: |
          ! grep -rnE '^(public )?import LeanVM\.' LeanVM/Spec | grep -vE 'import LeanVM\.Spec\.'
      # As for sphincs: only `main` saves, without Mathlib's build, which `lake exe cache get` fetches.
      - name: Restore the Lake build
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            formal/lean_vm/.lake
            !formal/lean_vm/.lake/packages/mathlib/.lake
          key: lake-lean-vm-${{ runner.os }}-${{ hashFiles('formal/lean_vm/lean-toolchain', 'formal/lean_vm/lake-manifest.json') }}-${{ hashFiles('formal/lean_vm/**/*.lean', 'formal/lean_xmss/LeanXmss/Scheme.lean', 'formal/lean_sphincs/Sphincs/Scheme.lean', 'formal/lean_da/LeanDa/Scheme.lean', 'formal/lean_da/LeanDa/Field.lean') }}
          restore-keys: lake-lean-vm-${{ runner.os }}-${{ hashFiles('formal/lean_vm/lean-toolchain', 'formal/lean_vm/lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean_vm
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: auto
      # The tests' build exceeds the runner's memory at its peak, and so does a module that runs
      # beside a heavy one; the swap goes on the runner's scratch disk.
      - name: Add swap
        run: |
          dir=/mnt; [ -d /mnt ] || dir=/
          sudo fallocate -l 16G "$dir/swapfile.lean"
          sudo chmod 600 "$dir/swapfile.lean"
          sudo mkswap "$dir/swapfile.lean"
          sudo swapon "$dir/swapfile.lean"
          free -g
      # `lake build` fails on any warning (`warningAsError`) and on an axiom footprint beyond
      # Lean's three (`LeanVM.lean`'s `#guard_msgs`). Lake has no job limit, and its parallel build
      # of the generated kernel-checked families exceeds the runner's memory, so the script builds
      # two modules at a time.
      - name: Build
        run: python3 -I scripts/ci-build.py
      - name: Test
        run: lake test
      - name: Check the Rust vectors' costly checks, compiled
        run: lake exe node-vectors
      - name: Check the guest's core IR data is current
        run: lake exe guest-core --check
      - name: Check the guest's certificates and check modules are current
        run: lake exe guest-cert --check
      - name: Save the Lake build
        if: github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            formal/lean_vm/.lake
            !formal/lean_vm/.lake/packages/mathlib/.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@stable
      # The Lean verifier and this commit's Rust verifier must agree on the committed proofs and
      # on mutations of them, so a protocol change in Rust fails here until the Lean one follows.
      - name: Rust-vs-Lean differential
        run: |
          lake build leanvm-verify
          cargo build --release --manifest-path scripts/rust-verifier-cli/Cargo.toml
          python3 -I scripts/fuzz-verifier.py tests/fixtures/verifier --jobs 4
      # The guest's mirror and its honest hint generator against real aggregations: the Rust test
      # writes each case's statement, witness and installed streams, and `guest-diff` regenerates the
      # streams from the witness, compares them and runs the guest's core IR on them.
      - name: Guest mirror and hint generator against Rust aggregations
        run: |
          lake build guest-diff
          LEANVM_GUEST_DIFF="$RUNNER_TEMP/guest-diff" cargo test --release -p rec_aggregation guest_diff -- --ignored
          .lake/build/bin/guest-diff "$RUNNER_TEMP"/guest-diff/*.txt
