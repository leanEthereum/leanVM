name: Lean

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xmss-formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cheap first pass: the axiom guard in `XmssSecurity.lean` catches a `sorry`
      # or a `native_decide` reaching the root theorem, this catches one parked
      # anywhere in the project.
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake formal/xmss | grep -vE ':[0-9]+: *(--|/-)'
      # Installs the toolchain from `formal/xmss/lean-toolchain`, fetches the
      # mathlib cache, and runs `lake build` on the default target, which
      # elaborates the root module and with it the `#guard_msgs` check. The
      # checked-in manifest is used as is: no `lake update`.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/xmss
      # The root module guards its own footprint with `#guard_msgs`, which an
      # edit to the expected message would silence. This asks again from
      # outside, against the list written here.
      - name: Check the axiom footprint
        working-directory: formal/xmss
        run: |
          printf 'import XmssSecurity\n#print axioms XmssSecurity.xmss_has_127_bits_of_classical_security\n' \
            > "$RUNNER_TEMP/axioms.lean"
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          grep -qF "'XmssSecurity.xmss_has_127_bits_of_classical_security' depends on axioms: [propext, Classical.choice, Quot.sound]" \
            "$RUNNER_TEMP/axioms.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: xmss-axioms
          path: ${{ runner.temp }}/axioms.txt

  sphincs-formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid proof escapes
        run: |
          ! grep -rnE '\b(sorry|sorryAx|admit|native_decide|unsafe|implemented_by)\b|#exit' \
              --include='*.lean' --exclude-dir=.lake formal/sphincs | grep -vE ':[0-9]+: *(--|/-)'
      # Without Mathlib's build, which `lake exe cache get` fetches, an entry takes
      # a small share of the repository's cache. Only `main` saves one; every
      # branch restores it, and GitHub drops it after a week unused.
      - name: Restore the Lake build
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            formal/sphincs/.lake
            !formal/sphincs/.lake/packages/mathlib/.lake
          key: lake-sphincs-${{ runner.os }}-${{ hashFiles('formal/sphincs/lean-toolchain', 'formal/sphincs/lake-manifest.json') }}-${{ hashFiles('formal/sphincs/**/*.lean') }}
          restore-keys: lake-sphincs-${{ runner.os }}-${{ hashFiles('formal/sphincs/lean-toolchain', 'formal/sphincs/lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/sphincs
          use-github-cache: false
      - name: Check the axiom footprint
        working-directory: formal/sphincs
        run: |
          printf 'import Sphincs\n#print axioms Sphincs.Lifetimes.requestedSecurity\n' \
            > "$RUNNER_TEMP/axioms.lean"
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          grep -qF "'Sphincs.Lifetimes.requestedSecurity' depends on axioms: [propext, Classical.choice, Quot.sound]" \
            "$RUNNER_TEMP/axioms.txt"
      - name: Save the Lake build
        if: github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            formal/sphincs/.lake
            !formal/sphincs/.lake/packages/mathlib/.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: sphincs-axioms
          path: ${{ runner.temp }}/axioms.txt
