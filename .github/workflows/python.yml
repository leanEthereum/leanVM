name: Python

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Verifier lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The commands AGENTS.md gives, at pinned versions.
      - name: Ruff format
        run: uvx ruff@0.16.9 format --check --line-length 150 python-verifier/verifier.py
      - name: Ruff check
        run: uvx ruff@0.16.9 check --line-length 150 python-verifier/verifier.py
      - name: Pyright
        run: uvx pyright@1.1.411 --pythonversion 3.12 python-verifier/verifier.py
