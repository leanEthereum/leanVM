name: Benchmark website

on:
  schedule:
    - cron: '23 0 * * *' # Daily at 00:23 UTC.
  workflow_dispatch:

permissions: {}

concurrency:
  group: benchmark-site-publish
  cancel-in-progress: false

jobs:
  prepare:
    # The main-branch installer registers the schedule; runtime source stays on riscv-exploration.
    if: >-
      github.repository == 'leanEthereum/leanVM' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/riscv-exploration')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      benchmarks: ${{ steps.plan.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: riscv-exploration
          persist-credentials: false
      - name: Validate snapshot tooling
        run: |
          python3 -m unittest discover -s scripts -p test_benchmark_site.py
          python3 -m unittest discover -s scripts -p test_mobile_bench_report.py
      - name: Pin the source and complete benchmark suite
        id: plan
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          benchmarks=$(python3 scripts/benchmark_site.py plan \
            --repository "$GITHUB_REPOSITORY" --commit "$sha" \
            --run-id "$GITHUB_RUN_ID" --output plan.json)
          echo "benchmarks=$benchmarks" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-plan
          path: plan.json
          if-no-files-found: error
          retention-days: 90

  desktop:
    name: ${{ matrix.benchmark }} (${{ matrix.testbed.name }})
    needs: prepare
    runs-on: ${{ matrix.testbed.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        testbed:
          - name: x86-64
            runner: [size-attester7870-x64, self-hosted-ghr]
          - name: arm64
            runner: [size-attester7870-arm64, self-hosted-ghr]
        benchmark: ${{ fromJSON(needs.prepare.outputs.benchmarks) }}
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: snapshot-plan
          path: snapshot-plan
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify native build and require NEON kernels
        id: cpu
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import platform
          import subprocess
          cpu = json.loads(subprocess.check_output(["lscpu", "--json"], text=True))
          model = next(item["data"] for item in cpu["lscpu"] if item["field"] == "Model name:")
          print("model=" + hashlib.sha256((platform.machine() + model).encode()).hexdigest()[:16])
          if platform.machine() == "aarch64":
              cfg = subprocess.check_output(["rustc", "--print", "cfg", "-C", "target-cpu=native"], text=True)
              for feature in ("aes", "sha3"):
                  if f'target_feature="{feature}"' not in cfg.splitlines():
                      raise SystemExit(f"native build does not enable {feature}")
          PY
      - uses: Swatinem/rust-cache@v2
        with:
          key: website-${{ matrix.testbed.name }}-${{ steps.cpu.outputs.model }}
      - name: Build pinned benchmark CLI
        run: cargo build --release --locked -p leanvm-cli
      - name: Measure and verify every planned sample
        env:
          TESTBED: ${{ matrix.testbed.name }}
          BENCHMARK: ${{ matrix.benchmark }}
        run: |
          python3 scripts/benchmark_site.py run-desktop \
            --plan snapshot-plan/plan.json --testbed "$TESTBED" --benchmark "$BENCHMARK" \
            --executable target/release/leanvm --output result.json
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-result-desktop-${{ matrix.testbed.name }}-${{ matrix.benchmark }}
          path: result.json
          if-no-files-found: error
          retention-days: 90

  mobile:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/mobile-bench.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  publish:
    needs: [prepare, desktop, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      pages: ${{ steps.hosting.outputs.pages }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: snapshot-plan
          path: snapshot-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: snapshot-result-*
          path: snapshot-results
          merge-multiple: false
      - name: Publish only a complete current-run snapshot
        run: |
          python3 scripts/benchmark_site.py publish \
            --plan snapshot-plan/plan.json --artifacts snapshot-results --output site/benchmarks/latest.json
          python3 scripts/benchmark_site.py check --input site/benchmarks/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-data
          path: site/benchmarks/latest.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-site
          path: site/benchmarks
          if-no-files-found: error
          retention-days: 90
      - name: Check Pages prerequisite without changing settings
        id: hosting
        env:
          PAGES_ENABLED: ${{ vars.BENCHMARK_PAGES_ENABLED }}
        run: |
          if [ "$PAGES_ENABLED" = true ]; then
            echo 'pages=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pages=false' >> "$GITHUB_OUTPUT"
            echo 'Static site uploaded. To deploy, enable GitHub Pages with GitHub Actions as source and set BENCHMARK_PAGES_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.hosting.outputs.pages == 'true'
        with:
          path: site/benchmarks

  deploy:
    needs: publish
    if: needs.publish.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static website
        id: deployment
        uses: actions/deploy-pages@v4
