name: Bench

# Runs the benchmarks and saves each testbed's Bencher Metric Format JSON as the artifact
# `bench-<testbed>`, with a PR's event as `pr-event`. It holds no secret, so it runs the
# same for a fork's PR: bench-track.yml uploads the results once this succeeds.
#
# The testbeds are GitHub-hosted, on every push and every PR, forks included: throwaway
# machines with no secrets. A testbed's name is its Bencher history, so renaming one
# starts a new one. Each pins its ISA: `target-cpu=native` would build for whichever CPU
# the job lands on, and a cached build then dies of SIGILL on an older one (see rust.yml).
# One runner label spans several CPU models of different speeds, so a testbed is the
# matrix name plus the CPU model the job landed on: each model keeps its own history.

on:
  push:
    # The branches PRs target: their history is what a PR is compared against.
    branches: [ "main", "riscv-exploration" ]
  pull_request:
    # Not `edited`: a description edit would restart, and so cancel, the PR's run.
    types: [ opened, reopened, synchronize ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # What bench-track.yml needs to name the PR's Bencher branch and its start point.
  event:
    name: PR event
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: pr-event
          path: ${{ github.event_path }}

  prove:
    name: Prove (${{ matrix.testbed.name }})
    runs-on: ${{ matrix.testbed.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testbed:
          # x86-64 Linux.
          - name: github-ubuntu
            runner: ubuntu-latest
            rustflags: -C target-cpu=haswell
          # arm64 Linux: the NEON kernels, which are chosen at compile time on `aes` (PMULL)
          # and `sha3` (EOR3), neither of which a generic aarch64 target enables.
          - name: github-ubuntu-arm
            runner: ubuntu-24.04-arm
            rustflags: -C target-cpu=neoverse-n2 -C target-feature=+aes,+sha3
    env:
      RUSTFLAGS: ${{ matrix.testbed.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The CPU the testbed's ISA is pinned for must have what it enables, or it dies of SIGILL.
      - name: CPU features
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          grep -m1 -E '^Features' /proc/cpuinfo
          for f in aes pmull sha3 sve2; do grep -qw "$f" <(grep -m1 -E '^Features' /proc/cpuinfo) || { echo "::error::no $f on this runner"; exit 1; }; done
      - name: Testbed
        id: testbed
        run: |
          cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -1 | tr 'A-Z' 'a-z' \
            | sed -E 's/\((r|tm)\)//g; s/ @.*//; s/ (cpu|processor)//g; s/ [0-9]+-core//g; s/[^a-z0-9]+/-/g; s/^-|-$//g')
          echo "name=${{ matrix.testbed.name }}-${cpu:?no CPU model}" >> "$GITHUB_OUTPUT"
      # One cache per matrix entry; RUSTFLAGS is part of its key.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.testbed.name }}
      - name: Prove flock's hash batch
        env:
          FLOCK_N_LOG: 18
          BENCH_REPEAT: 5
        run: cargo bench -p flock --bench hash_batch -- --json > bench.json && cat bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ steps.testbed.outputs.name }}
          path: bench.json
