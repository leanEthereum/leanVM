name: Bench

# Proves a PR's merge commit and its base (the merge commit's first parent) in turns on one
# runner, so the comparison is free of which machine the job landed on: one job per testbed
# and benchmark, each building both sides and running them `ROUNDS` times in the order base,
# PR, PR, base, ... Each job saves its runs as the artifact `ab-<testbed>-<benchmark>`, and
# bench-comment.yml, on the default branch, posts what changed on the PR. It gates nothing.
# A job is one CLI benchmark, or one `benches/` target with all the benchmarks it prints.
# scripts/ab.sh does all of it, and runs the same comparison on a developer's machine.
#
# The testbeds are GitHub-hosted runners, forks' PRs included. Each pins its ISA:
# `target-cpu=native` would build for whichever CPU the job lands on, and a cached build then
# dies of SIGILL on an older one (see rust.yml).

on:
  pull_request:
    # Not `edited`: a description edit would restart, and so cancel, the PR's run.
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ROUNDS: 5

jobs:
  ab:
    name: ${{ matrix.benchmark.name }} (${{ matrix.testbed.name }})
    runs-on: ${{ matrix.testbed.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testbed:
          - name: x86-64
            runner: ubuntu-latest
            rustflags: -C target-cpu=haswell
          # The NEON kernels, which are chosen at compile time on `aes` (PMULL) and `sha3`
          # (EOR3), neither of which a generic aarch64 target enables.
          - name: arm64
            runner: ubuntu-24.04-arm
            rustflags: -C target-cpu=neoverse-n2 -C target-feature=+aes,+sha3
        # The cases of `proven()` and `proven_trees()` in bins/leanvm/src/tracked.rs, run by the
        # CLI (`-1thread`, one thread: the CLI proves it, a tree's leaf included, with
        # `LEANVM_NUM_THREADS=1`; a tree's case, `Nto1` for N proofs combined into 1, prints two
        # benchmarks: `-first`, a first-level node, the RISC-V verifier in rows over N leaf
        # proofs, and `-node`, a higher node, the recursion verifier in rows over N child
        # proofs), then the `benches/` targets scripts/ab.sh names, each run with `--json`.
        benchmark:
          - name: fibonacci-asm-2000000
          - name: hash-50000
          - name: leanxmss-100
          - name: leanxmss-100-1thread
          - name: leansphincs-26
          - name: falcon-7
          - name: aggregate-leanxmss-100-2to1
          - name: aggregate-leanxmss-100-4to1
          - name: aggregate-leanxmss-100-2to1-1thread
          - name: flock-hash-batch-262144
          - name: flock-arithmetic-batch
          - name: pcs-throughput
          - name: blake2s-batch
          - name: kernels
    env:
      RUSTFLAGS: ${{ matrix.testbed.rustflags }}
      BENCHMARK: ${{ matrix.benchmark.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, the base.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      # The CPU the testbed's ISA is pinned for must have what it enables, or it dies of SIGILL.
      - name: CPU features
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          grep -m1 -E '^Features' /proc/cpuinfo
          for f in aes pmull sha3 sve2; do grep -qw "$f" <(grep -m1 -E '^Features' /proc/cpuinfo) || { echo "::error::no $f on this runner"; exit 1; }; done
      # One cache per testbed; RUSTFLAGS is part of its key.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.testbed.name }}
      - name: Prove the PR and its base in turns
        env:
          PR: ${{ github.event.number }}
          TESTBED: ${{ matrix.testbed.name }}
        run: scripts/ab.sh --ci --pr "$PR" --testbed "$TESTBED" --out ab "$BENCHMARK"
      - uses: actions/upload-artifact@v4
        with:
          name: ab-${{ matrix.testbed.name }}-${{ matrix.benchmark.name }}
          path: ab/ab-${{ matrix.testbed.name }}-${{ matrix.benchmark.name }}/ab.json
