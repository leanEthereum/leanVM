name: Bench
on:
  workflow_dispatch:
    inputs:
      base:
        description: Paired upstream baseline
        default: f52bd991c8623894e7b03a2e50bede6c248ea1ad
      head:
        description: Exact selected production head
        required: true
permissions:
  contents: read
  actions: read
jobs:
  grid:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: size-attester7870-x64
    runs-on: [self-hosted-ghr, '${{ matrix.runner }}']
    timeout-minutes: 90
    env:
      BASE: '${{ inputs.base }}'
      CANDIDATE: '${{ inputs.head }}'
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Paired Xeon loop-restoration control
        run: python3 scripts/grid-x86-control.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-${{ matrix.arch }}
          path: grid-evidence/
