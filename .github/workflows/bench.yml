name: Bench
on:
  workflow_dispatch:
    inputs:
      base:
        description: Uninstrumented baseline
        default: 5cfcc744c059bbb134294f2c07c2d442ec7fb8ef
      head:
        description: Diagnostic head
        required: false
      phase:
        description: attribution or followup
        default: attribution
permissions:
  contents: read
jobs:
  attribution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: size-attester7870-x64
          - arch: arm64
            runner: size-attester7870-arm64
    runs-on: [self-hosted-ghr, '${{ matrix.runner }}']
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_BUILD_JOBS: 4
      LEANVM_NUM_THREADS: 1
      BASE: '${{ inputs.base }}'
      ATTRIBUTION_PHASE: '${{ inputs.phase }}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ inputs.head }}'
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Controlled attribution
        run: python3 scripts/arm-attribution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution-${{ matrix.arch }}
          path: attribution/
