name: Bench

# Proves a PR's merge commit and its base (the merge commit's first parent) in turns on one
# runner, so the comparison is free of which machine the job landed on: one job per testbed
# and benchmark, each building both sides and running them `ROUNDS` times in the order base,
# PR, PR, base, ... Each job saves its runs as the artifact `ab-<testbed>-<benchmark>`, and
# bench-comment.yml, on the default branch, posts what changed on the PR. It gates nothing.
# A job is one CLI benchmark, or one `benches/` target with all the benchmarks it prints.
#
# The testbeds are GitHub-hosted runners, forks' PRs included. Each pins its ISA:
# `target-cpu=native` would build for whichever CPU the job lands on, and a cached build then
# dies of SIGILL on an older one (see rust.yml).

on:
  pull_request:
    # Not `edited`: a description edit would restart, and so cancel, the PR's run.
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ROUNDS: 5

jobs:
  ab:
    name: ${{ matrix.benchmark.name }} (${{ matrix.testbed.name }})
    runs-on: ${{ matrix.testbed.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        testbed:
          - name: x86-64
            runner: ubuntu-latest
            rustflags: -C target-cpu=haswell
          # The NEON kernels, which are chosen at compile time on `aes` (PMULL) and `sha3`
          # (EOR3), neither of which a generic aarch64 target enables.
          - name: arm64
            runner: ubuntu-24.04-arm
            rustflags: -C target-cpu=neoverse-n2 -C target-feature=+aes,+sha3
        # The cases of `proven()` and `proven_trees()` in bins/leanvm/src/tracked.rs, run by the
        # CLI (a tree's case, `Nto1` for N proofs combined into 1, prints two benchmarks:
        # `-first`, a first-level node, the RISC-V verifier in rows over N leaf proofs, and
        # `-node`, a higher node, the recursion verifier in rows over N child proofs), then the
        # `benches/` targets (`package`, `target`), each run with `--json`.
        benchmark:
          - name: fibonacci-asm-2000000
          - name: hash-50000
          - name: leanxmss-100
          - name: leansphincs-26
          - name: aggregate-leanxmss-100-2to1
          - name: aggregate-leanxmss-100-4to1
          - { name: flock-hash-batch-262144, package: flock, target: hash_batch }
          - { name: flock-arithmetic-batch, package: flock, target: arithmetic_batch }
          - { name: pcs-throughput, package: pcs, target: throughput }
          - { name: blake2s-batch, package: primitives, target: hash_throughput }
          - { name: kernels, package: primitives, target: kernels }
    env:
      RUSTFLAGS: ${{ matrix.testbed.rustflags }}
      BENCHMARK: ${{ matrix.benchmark.name }}
      PACKAGE: ${{ matrix.benchmark.package }}
      TARGET: ${{ matrix.benchmark.target }}
      FLOCK_N_LOG: 18
      BENCH_REPEAT: 1
      BENCH_COOLDOWN: 0
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, the base.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      # The CPU the testbed's ISA is pinned for must have what it enables, or it dies of SIGILL.
      - name: CPU features
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          grep -m1 -E '^Features' /proc/cpuinfo
          for f in aes pmull sha3 sve2; do grep -qw "$f" <(grep -m1 -E '^Features' /proc/cpuinfo) || { echo "::error::no $f on this runner"; exit 1; }; done
      # One cache per testbed; RUSTFLAGS is part of its key.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.testbed.name }}
      - name: Build the PR and its base
        run: |
          build() {
            mkdir -p "ab/$1"
            if [ -n "$TARGET" ]; then
              exe=$(cargo bench -p "$PACKAGE" --bench "$TARGET" --no-run --message-format=json \
                | jq -r --arg target "$TARGET" 'select(.reason == "compiler-artifact" and .target.name == $target) | .executable') || return
            else
              cargo build --release -p leanvm-cli || return
              exe=target/release/leanvm
            fi
            cp "$exe" "ab/$1/bench"
          }
          build head
          git checkout --quiet --detach HEAD^1
          # A base without the target (one this PR adds) has nothing to run: see below.
          build base || echo "::warning::the base cannot build $BENCHMARK"
          git checkout --quiet --detach "$GITHUB_SHA"
      - name: Prove in turns
        run: |
          run() {
            if [ -n "$TARGET" ]; then
              "ab/$1/bench" --json
            else
              "ab/$1/bench" bench --only "$BENCHMARK" --repeat 1 --cooldown 0
            fi
          }
          # A base that cannot run the benchmark at all (one this PR adds, a base older than
          # `--only`, or a target whose base prints no JSON) fails its first run, and the PR's
          # runs are then compared with nothing: the comment shows them as new. Any other
          # failure fails the job.
          base=true
          for round in $(seq "$ROUNDS"); do
            if [ $((round % 2)) = 1 ]; then order="base head"; else order="head base"; fi
            for side in $order; do
              if [ "$side" = base ] && [ "$base" = false ]; then continue; fi
              if ! run "$side" > result.json || ! jq -e 'type == "object"' result.json > /dev/null; then
                if [ "$side" = head ] || [ "$round" != 1 ]; then exit 1; fi
                echo "::warning::the base cannot run $BENCHMARK: the PR's runs are compared with nothing"
                base=false
                continue
              fi
              jq -c --argjson round "$round" --arg side "$side" '{round: $round, side: $side, results: .}' result.json | tee -a runs.jsonl
            done
          done
      - name: Save the runs
        env:
          PR: ${{ github.event.number }}
          TESTBED: ${{ matrix.testbed.name }}
        run: |
          cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -n1)
          jq -n --argjson pr "$PR" --arg base "$(git rev-parse HEAD^1)" --arg testbed "$TESTBED" --arg cpu "$cpu" \
            --slurpfile runs runs.jsonl '{pr: $pr, base: $base, testbed: $testbed, cpu: $cpu, runs: $runs}' > ab.json
      - uses: actions/upload-artifact@v4
        with:
          name: ab-${{ matrix.testbed.name }}-${{ matrix.benchmark.name }}
          path: ab.json
