name: Bench
on:
  workflow_dispatch:
    inputs:
      base:
        description: Exact baseline
        default: f52bd991c8623894e7b03a2e50bede6c248ea1ad
      head:
        description: Diagnostic head
        required: false
permissions:
  contents: read
jobs:
  locality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: size-attester7870-x64
          - arch: arm64
            runner: size-attester7870-arm64
    runs-on: [self-hosted-ghr, '${{ matrix.runner }}']
    timeout-minutes: 120
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_BUILD_JOBS: 4
      BASE: '${{ inputs.base }}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ inputs.head }}'
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Compare bounded basis chunks
        run: python3 scripts/basis-locality.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locality-${{ matrix.arch }}
          path: locality-evidence/
