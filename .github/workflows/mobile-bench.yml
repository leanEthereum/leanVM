name: Mobile benchmarks

on:
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: Exact upstream riscv-exploration commit to benchmark
        required: true
        type: string
    secrets:
      BROWSERSTACK_USERNAME:
        required: true
      BROWSERSTACK_ACCESS_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: mobile-bench-${{ github.event_name == 'pull_request' && github.ref || 'browserstack' }}
  cancel-in-progress: false

env:
  CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C target-cpu=generic -C target-feature=+aes,-sha3
  CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS: -C target-cpu=generic -C target-feature=+aes,+sha3
  CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUSTFLAGS: -C target-cpu=generic -C target-feature=+aes,+sha3
  CARGO_TARGET_X86_64_APPLE_IOS_RUSTFLAGS: -C target-cpu=generic
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'

jobs:
  source:
    # Disabled on pull requests while #595's Clean circuits are in progress; remove before merging.
    if: github.event_name != 'pull_request'
    name: Validate mobile benchmark source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate caller before checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            exit 0
          fi
          case "$GITHUB_REPOSITORY" in
            leanEthereum/leanVM) ;;
            *) echo 'Mobile collection requires an upstream repository.' >&2; exit 1 ;;
          esac
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            schedule:refs/heads/main|schedule:refs/heads/riscv-exploration|workflow_dispatch:refs/heads/main|workflow_dispatch:refs/heads/riscv-exploration) ;;
            *) echo 'Mobile collection requires a trusted scheduled or manual caller.' >&2; exit 1 ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected an exact source SHA.' >&2; exit 1; }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify upstream ancestry and record source
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            test "$actual_sha" = "$SOURCE_SHA"
            git fetch --no-tags origin refs/heads/riscv-exploration:refs/remotes/origin/riscv-exploration
            git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/riscv-exploration
          fi
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
      - name: Require BrowserStack credentials for collection
        if: github.event_name != 'pull_request'
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo 'Both BrowserStack credentials are required for the complete snapshot.' >&2
            exit 1
          fi

  android:
    name: Android ARM64 release
    # Keep provider sessions sequential; both platforms use the validated caller SHA.
    needs: [source, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: bench-mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4.0.0
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
      - name: Select Java and install pinned Android packages
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          export GRADLE_USER_HOME="$RUNNER_TEMP/mobile-bench-gradle"
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> "$GITHUB_ENV"
          mkdir -p "$GRADLE_USER_HOME"
          printf 'org.gradle.workers.max=2\norg.gradle.daemon=false\n' > "$GRADLE_USER_HOME/gradle.properties"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.5'
          cache-disabled: true
          add-job-summary: never
          dependency-graph: disabled
      - name: Install pinned host tools
        env:
          RUSTFLAGS: ''
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo install mobench --git https://github.com/worldcoin/mobile-bench-rs --rev 217cfd4f78db1284276a1a1da44e3bf473729f5c --locked
      - name: Build crypto-enabled ARM64 runner and test APKs without credentials
        run: |
          python3 ../scripts/mobile-bench-package.py --platform android shielded_prove
          python3 ../scripts/mobile-bench-package.py --platform android shielded_aggregate
          python3 ../scripts/mobile-bench-package.py --platform android falcon_prove
          python3 ../scripts/mobile-bench-package.py --platform android stateproof_prove
      - name: Save credential-free release packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobile-bench-android-packages
          path: bench-mobile/target/mobile-bench-packages/android/
          if-no-files-found: error
          retention-days: 7
      - name: Validate candidate device and run trusted benchmarks
        if: github.event_name != 'pull_request'
        timeout-minutes: 65
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 ../scripts/mobile-bench-run.py --platform android --source-sha "$SOURCE_SHA"
      - name: Publish mobile results in the Actions summary
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          python3 ../scripts/mobile-bench-report.py target/mobile-bench-results/android \
            --repository "$GITHUB_REPOSITORY" --head "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Save sanitized results and provenance
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: snapshot-result-mobile-android
          path: |
            bench-mobile/target/mobile-bench-results/android/metadata.json
            bench-mobile/target/mobile-bench-results/android/raw-results.json
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS ARM64 release
    needs: source
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        working-directory: bench-mobile
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      XCODE_XCCONFIG_FILE: ${{ github.workspace }}/bench-mobile/ios.xcconfig
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Check mobile report integrity
        run: python3 ../scripts/test_mobile_bench_report.py
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.99.0
          # The pinned native-C-ABI builder creates device and universal simulator slices.
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Select pinned Xcode SDK and XcodeGen
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '18.5'
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/mobile-bench-tools"
          echo "$RUNNER_TEMP/mobile-bench-tools/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mobile-bench-tools/xcodegen/bin/xcodegen" --version
      - name: Install pinned host tools
        env:
          RUSTFLAGS: ''
        run: cargo install mobench --git https://github.com/worldcoin/mobile-bench-rs --rev 217cfd4f78db1284276a1a1da44e3bf473729f5c --locked
      - name: Build release IPA and XCUITest without credentials
        run: |
          python3 ../scripts/mobile-bench-package.py --platform ios shielded_prove
          python3 ../scripts/mobile-bench-package.py --platform ios shielded_aggregate
          python3 ../scripts/mobile-bench-package.py --platform ios falcon_prove
          python3 ../scripts/mobile-bench-package.py --platform ios stateproof_prove
      - name: Save credential-free release packages
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mobile-bench-ios-packages
          path: bench-mobile/target/mobile-bench-packages/ios/
          if-no-files-found: error
          retention-days: 7
      - name: Validate iPhone 14 iOS 16 and run trusted benchmarks
        if: github.event_name != 'pull_request'
        timeout-minutes: 65
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 ../scripts/mobile-bench-run.py --platform ios --source-sha "$SOURCE_SHA"
      - name: Publish mobile results in the Actions summary
        if: github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          python3 ../scripts/mobile-bench-report.py target/mobile-bench-results/ios \
            --repository "$GITHUB_REPOSITORY" --head "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Save sanitized results and provenance
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: snapshot-result-mobile-ios
          path: |
            bench-mobile/target/mobile-bench-results/ios/metadata.json
            bench-mobile/target/mobile-bench-results/ios/raw-results.json
          if-no-files-found: error
          retention-days: 30
