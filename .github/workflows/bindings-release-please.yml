name: Bindings release please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # release-please names a package's outputs after its path, here `bindings`.
      release_created: ${{ steps.rp.outputs['bindings--release_created'] }}
      tag_name: ${{ steps.rp.outputs['bindings--tag_name'] }}
      pr_branch: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).headBranchName || '' }}
    steps:
      # Maintains one "release PR" for the bindings from the conventional commits touching
      # bindings/. It sets the workspace version in bindings/Cargo.toml, the versions in the README
      # install instructions, and bindings/CHANGELOG.md. Merging it creates the bindings-vX.Y.Z tag
      # that every binding is released from.
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please sets the bindings workspace crates' versions in bindings/Cargo.lock itself (its
  # parser wraps each value, hence `@.name.value` in its config): this is a fallback, which finds
  # the lock in sync.
  sync-cargo-lock:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr_branch != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Update the workspace crates in bindings/Cargo.lock
        working-directory: bindings
        run: |
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Cargo.lock with the release version" -- Cargo.lock
          git push origin "HEAD:${{ needs.release-please.outputs.pr_branch }}"

  # A pull request or push made with GITHUB_TOKEN starts no workflow, so the release pull request
  # would get no CI; a dispatch is the one start that token allows. Its runs report on the pull
  # request's head commit, after the lock sync above.
  release-pr-ci:
    needs: [release-please, sync-cargo-lock]
    if: ${{ needs.release-please.outputs.pr_branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run bindings CI on the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        run: gh workflow run bindings-ci.yml --ref "$BRANCH" -R "$GITHUB_REPOSITORY"

  # A tag pushed with GITHUB_TOKEN starts no workflow, so dispatch bindings-release.yml on it.
  trigger-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bindings-release.yml',
              ref: '${{ needs.release-please.outputs.tag_name }}',
            });
