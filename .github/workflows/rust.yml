name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The compiled guest, downloaded from the `guest-artifact` job by every job that builds `aggregation`.
  LEANVM_GUEST_ARTIFACT: ${{ github.workspace }}/guests/lean_ethereum.compiled
  RUST_BACKTRACE: 1
  # Pin the ISA, overriding `target-cpu=native` from .cargo/config.toml, so a cached build runs on any runner.
  # Haswell has no VPCLMULQDQ or AVX-512, so the tests never reach the arms that need them.
  # The `isa` job compiles the others.
  RUSTFLAGS: -C target-cpu=haswell

jobs:
  # The guest the prover loads (`guests/lean_ethereum.compiled`) is not committed: the Lean back end compiles it
  # (`crates/aggregation/build.rs` runs `formal/lean_vm/scripts/guest-artifact`). Written once here, from this
  # tree, and handed to every job that builds `aggregation` (`LEANVM_GUEST_ARTIFACT`), which then runs no Lean.
  guest-artifact:
    name: The compiled guest (Lean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The Lean build `guest-artifact` needs, Mathlib's fetched by the script (`lake exe cache get`); only `main` saves.
      - name: Restore the Lean build
        id: lean-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            formal/lean_vm/.lake
            !formal/lean_vm/.lake/packages/mathlib/.lake
            formal/Statement/.lake/build
          key: guest-artifact-lean-${{ runner.os }}-${{ hashFiles('formal/lean_vm/lean-toolchain', 'formal/lean_vm/lake-manifest.json', 'formal/*/lakefile.*') }}-${{ hashFiles('formal/lean_vm/LeanVM/Compiler/**', 'formal/lean_vm/LeanVM/Core/**', 'formal/lean_vm/cli/GuestArtifact.lean', 'formal/Statement/**/*.lean', 'guests/lean_ethereum.py', 'crates/aggregation/src/**') }}
          restore-keys: guest-artifact-lean-${{ runner.os }}-${{ hashFiles('formal/lean_vm/lean-toolchain', 'formal/lean_vm/lake-manifest.json', 'formal/*/lakefile.*') }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: formal/lean_vm/scripts/guest-export
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile the guest (guest-artifact)
        run: formal/lean_vm/scripts/guest-artifact
      - name: Save the Lean build
        if: github.ref == 'refs/heads/main' && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            formal/lean_vm/.lake
            !formal/lean_vm/.lake/packages/mathlib/.lake
            formal/Statement/.lake/build
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: guest-artifact
          path: guests/lean_ethereum.compiled
          retention-days: 3

  test:
    name: Test
    needs: guest-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guest-artifact
          path: guests
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The flags live in .cargo/config.toml's aliases
      - name: Test
        run: cargo testall
      - name: Test (the API on the experimental prover)
        run: cargo test --release -p lean_vm --features experimental_prover --test api
      # Without AVX2 the batched Keccak runs its scalar lanes, which no other job reaches.
      - name: Test (Keccak's scalar lanes)
        run: cargo test --release -p keccak256
        env:
          RUSTFLAGS: -C target-cpu=x86-64

  # The NEON kernels, as bench.yml's arm64 testbed builds them: the x86 job's haswell reaches none of them.
  test-arm64:
    needs: guest-artifact
    name: Test (neoverse-n2)
    runs-on: ubuntu-24.04-arm
    env:
      RUSTFLAGS: -C target-cpu=neoverse-n2 -C target-feature=+aes,+sha3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guest-artifact
          path: guests
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo testall

  clippy:
    needs: guest-artifact
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guest-artifact
          path: guests
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippyall
      - name: Clippy (the API and the sidecar on the experimental prover)
        run: cargo clippy --release -p lean_vm -p leanvm-sidecar --all-targets --features experimental_prover -- -D warnings
      - name: Clippy (the API in its sidecar mode)
        run: cargo clippy --release -p lean_vm --all-targets --features sidecar -- -D warnings

  # Clippy type-checks every arm the ISA selects, so it also does `cargo check`'s work.
  # Nothing runs: GitHub's x86-64 runners do not reliably have AVX-512.
  # With an explicit `--target`, RUSTFLAGS reach only the target's code, so build scripts still run on the runner.
  # The arm64 entries build on arm64 runners, as jemalloc's build script wants a C compiler for the target.
  isa:
    needs: guest-artifact
    name: Clippy (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            rustflags: -C target-cpu=x86-64
          # AVX2, VPCLMULQDQ and GFNI, no AVX-512.
          - name: alderlake
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            rustflags: -C target-cpu=alderlake
          # AVX2 and VPCLMULQDQ without GFNI: the stable lanes' nibble-table byte maps.
          - name: znver3
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            rustflags: -C target-cpu=znver3
          # AVX-512 without VPCLMULQDQ or GFNI.
          - name: x86-64-v4
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            rustflags: -C target-cpu=x86-64-v4
          # AVX-512 with VPCLMULQDQ, GFNI and VBMI, the production arms.
          - name: znver4
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            rustflags: -C target-cpu=znver4
          # Without AES (so without PMULL): experimental's NEON fallbacks, stable's portable lanes.
          - name: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            rustflags: -C target-cpu=generic
          # PMULL without EOR3 (Graviton2): stable's NEON lanes without SHA3.
          - name: neoverse-n1
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            rustflags: -C target-cpu=neoverse-n1 -C target-feature=+aes
          # The NEON kernels, as bench.yml's arm64 testbed builds them.
          - name: neoverse-n2
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            rustflags: -C target-cpu=neoverse-n2 -C target-feature=+aes,+sha3
          # The Apple silicon arms.
          - name: apple-m1
            target: aarch64-apple-darwin
            runner: macos-latest
            rustflags: -C target-cpu=apple-m1
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guest-artifact
          path: guests
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # One cache per ISA; RUSTFLAGS is part of its key.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

  doc:
    needs: guest-artifact
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guest-artifact
          path: guests
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rustdoc
        run: cargo docall

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      # No build: machete reads the manifests and greps the sources.
      # `--with-metadata` resolves each package through `cargo metadata`, so dev-dependencies are read too.
      - name: Check for unused dependencies
        run: cargo machete --with-metadata
