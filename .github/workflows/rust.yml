name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin the ISA to AVX2, overriding `target-cpu=native` from .cargo/config.toml:
  # otherwise the SIMD backend under test depends on the runner we land on.
  RUSTFLAGS: -C target-cpu=haswell

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The flags live in .cargo/config.toml's aliases
      - name: Test
        run: cargo testall

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippyall

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rustdoc
        run: cargo docall

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The `rust-version` of the root Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - name: Check on the declared Rust version
        run: cargo check --workspace --all-targets

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Three workers, so the pool's dispatch, park and completion paths all run.
      LEANVM_NUM_THREADS: 3
      # Miri hides the environment unless told, and the pool would then run one thread.
      # The pool's workers and the arena's region live for the process, which reads as a leak.
      # The arena turns slab addresses back into pointers.
      # Each seed is another thread interleaving.
      MIRIFLAGS: >-
        -Zmiri-env-forward=LEANVM_NUM_THREADS
        -Zmiri-ignore-leaks
        -Zmiri-permissive-provenance
        -Zmiri-many-seeds=0..8
    steps:
      - uses: actions/checkout@v4
      # The latest nightly that ships Miri.
      - uses: dtolnay/rust-toolchain@miri
      - name: Miri
        run: cargo miri test -p parallel -p zk_alloc

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses

  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      # No build: machete reads the manifests and greps the sources.
      #
      # `--with-metadata` resolves each package through `cargo metadata`, which is what makes it read dev-dependencies.
      # The guests are scanned too, under their own nightly toolchain, which rustup installs on first use.
      - name: Check for unused dependencies
        run: cargo machete --with-metadata
