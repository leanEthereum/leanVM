name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin the ISA to AVX2, overriding `target-cpu=native` from .cargo/config.toml:
  # otherwise the SIMD backend under test depends on the runner we land on.
  RUSTFLAGS: -C target-cpu=haswell

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The flags live in .cargo/config.toml's aliases
      - name: Test
        run: cargo testall

  clippy:
    name: Clippy (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
            rustflags: -C target-cpu=haswell
          - arch: ARM64
            runner: ubuntu-24.04-arm
            rustflags: -C target-cpu=neoverse-n2 -C target-feature=+aes,+sha3
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippyall
      # The haswell pin leaves the AVX-512 backends uncompiled; lint them here (`clippyall` with a `--target`).
      # A step `RUSTFLAGS` replaces the job's, which would otherwise beat the target's flags.
      - name: Clippy on the AVX-512 backends
        if: matrix.arch == 'x86-64'
        env:
          RUSTFLAGS: -C target-feature=+avx512f,+avx512bw,+avx512vl,+vpclmulqdq,+pclmulqdq,+gfni,+avx2,+aes
        run: cargo clippy --release --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings

  clippy-guests:
    name: Clippy (RISC-V guests)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      # The guests' toolchain file pins a dated nightly with `rust-src` alone; rustup installs it here, with clippy and rustfmt.
      - name: Install the guests' toolchain
        working-directory: programs/hash/guest
        run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs -> target
      - name: Clippy
        run: programs/clippy.sh
      - name: Check formatting
        run: |
          for guest in programs/*/guest; do
            (cd "$guest" && cargo fmt -- --check)
          done

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rustdoc
        run: cargo docall

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The `rust-version` of the root Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - name: Check on the declared Rust version
        run: cargo check --workspace --all-targets

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Three workers, so the pool's dispatch, park and completion paths all run.
      LEANVM_NUM_THREADS: 3
      # Miri hides the environment unless told, and the pool would then run one thread.
      # The pool's workers live for the process, which reads as a leak.
      # Each seed is another thread interleaving.
      MIRIFLAGS: >-
        -Zmiri-env-forward=LEANVM_NUM_THREADS
        -Zmiri-ignore-leaks
        -Zmiri-many-seeds=0..8
    steps:
      - uses: actions/checkout@v4
      # The latest nightly that ships Miri.
      - uses: dtolnay/rust-toolchain@miri
      - name: Miri
        run: cargo miri test -p parallel

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses

  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      # No build: machete reads the manifests and greps the sources.
      #
      # `--with-metadata` resolves each package through `cargo metadata`, which is what makes it read dev-dependencies.
      # The guests are scanned too, under their own nightly toolchain, which rustup installs on first use.
      - name: Check for unused dependencies
        run: cargo machete --with-metadata
