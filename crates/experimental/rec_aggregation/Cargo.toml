[package]
name = "experimental_rec_aggregation"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
primitives = { package = "experimental_primitives", path = "../primitives" }
fiat_shamir = { package = "experimental_fiat_shamir", path = "../fiat_shamir" }
parallel = { package = "experimental_parallel", path = "../parallel" }
pcs = { package = "experimental_pcs", path = "../pcs" }
keccak_gkr = { package = "experimental_keccak_gkr", path = "../keccak_gkr" }
leanvm_core = { package = "experimental_leanvm_core", path = "../leanvm_core" }
lean_compiler = { package = "experimental_lean_compiler", path = "../lean_compiler" }
lean_xmss = { package = "experimental_lean_xmss", path = "../lean_xmss" }
lean_sphincs = { package = "experimental_lean_sphincs", path = "../lean_sphincs" }
lean_da = { package = "experimental_lean_da", path = "../lean_da" }
verifier.workspace = true
rand = { workspace = true, optional = true }
tracing.workspace = true

[features]
# `signers_cache`: cached benchmark signers, for tests and the CLI.
signers-cache = ["dep:rand"]

[dev-dependencies]
rand.workspace = true
