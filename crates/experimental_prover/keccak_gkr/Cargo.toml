[package]
name = "experimental_keccak_gkr"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parallel = { package = "experimental_parallel", path = "../parallel" }
primitives = { package = "experimental_primitives", path = "../primitives" }
fiat_shamir = { package = "fiat_shamir_prover", path = "../../fiat_shamir_prover" }
pcs = { package = "experimental_pcs", path = "../pcs" }
tracing.workspace = true
allocator = { workspace = true, optional = true }
bench_harness = { workspace = true, optional = true }
isa = { workspace = true, optional = true }
verifier.workspace = true

[features]
# The standalone batch benchmark (`batch_bench`), for the `hash_batch` target.
bench = ["dep:allocator", "dep:bench_harness", "dep:isa", "primitives/test-util"]

[dev-dependencies]
keccak_gkr = { package = "experimental_keccak_gkr", path = ".", features = ["bench"] }

[[bench]]
name = "hash_batch"
harness = false
