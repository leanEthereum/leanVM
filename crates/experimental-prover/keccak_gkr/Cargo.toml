[package]
name = "experimental_keccak_gkr"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parallel = { package = "experimental_parallel", path = "../parallel" }
primitives = { package = "experimental_primitives", path = "../primitives" }
fiat_shamir = { package = "experimental_fiat_shamir", path = "../fiat_shamir" }
pcs = { package = "experimental_pcs", path = "../pcs" }
tracing.workspace = true
bench = { workspace = true, optional = true }
verifier = { workspace = true, optional = true }

[features]
# The standalone batch benchmark (`batch_bench`), for the `hash_batch` target and the CLI.
bench = ["dep:bench", "dep:verifier", "primitives/test-util"]

[dev-dependencies]
keccak_gkr = { package = "experimental_keccak_gkr", path = ".", features = ["bench"] }

[[bench]]
name = "hash_batch"
harness = false
