[package]
name = "aggregation"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
isa.workspace = true
verifier.workspace = true
keccak256.workspace = true
zkdsl_compiler.workspace = true
lean_xmss.workspace = true
lean_sphincs.workspace = true
lean_da.workspace = true
# The protocol's structure (bus blocks, stacking, grinds, the stacked bytecode), from the reference prover.
leanvm_core = { package = "stable_leanvm_core", path = "../stable-prover/leanvm_core" }
fiat_shamir = { package = "stable_fiat_shamir", path = "../stable-prover/fiat_shamir" }
pcs = { package = "stable_pcs", path = "../stable-prover/pcs" }
primitives = { package = "stable_primitives", path = "../stable-prover/primitives" }
rand = { workspace = true, optional = true }
tracing.workspace = true

[features]
# `signers_cache`: cached benchmark signers, for tests and the CLI.
signers-cache = ["dep:rand"]

[dev-dependencies]
rand.workspace = true
