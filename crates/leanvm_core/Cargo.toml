[package]
name = "leanvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Record the recursion circuit builder's calls, for `cargo leanvm circuits` and `verification/circuits`' `checkrec`. Off in every ordinary build.
circuit-trace = []

[dependencies]
parallel.workspace = true
primitives.workspace = true
fiat_shamir.workspace = true
pcs.workspace = true
flock.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
leanvm_guest.workspace = true
bench.workspace = true
primitives = { workspace = true, features = ["test-util"] }
# Honest leanXMSS signatures for the recursion circuit verifying them; it depends on `leanvm` only for its own tests.
leanxmss-host.workspace = true

[[bench]]
name = "class_witness"
harness = false

[[bench]]
name = "class_batch"
harness = false
