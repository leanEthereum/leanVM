[package]
name = "primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
p3-binary-field.workspace = true
p3-field.workspace = true
parallel.workspace = true
rand = { workspace = true, optional = true }

[features]
# Shared test fixtures (`test_util`) used by this and other crates' tests.
# Kept off the default build so `rand` stays out of the production graph.
test-util = ["dep:rand"]

[dev-dependencies]
proptest.workspace = true
bincode.workspace = true
primitives = { path = ".", features = ["test-util"] }
bench.workspace = true

[[bench]]
name = "hash_throughput"
harness = false

[[bench]]
name = "kernels"
harness = false
