[package]
name = "primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parallel.workspace = true
rand = { workspace = true, optional = true }
serde.workspace = true
zk_alloc.workspace = true

[features]
# Test-only helpers (`test_rng`) used by this and other crates' tests.
# Kept off the default build so `rand` stays out of the production graph.
test-util = ["dep:rand"]

[dev-dependencies]
primitives = { path = ".", features = ["test-util"] }
bench.workspace = true
bincode.workspace = true

[[bench]]
name = "hash_throughput"
harness = false
