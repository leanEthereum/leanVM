[package]
name = "stable_primitives"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
parallel = { package = "stable_parallel", path = "../parallel" }
rand = { workspace = true, optional = true }

[features]
# Test-only helpers (`test_rng`) used by this and other crates' tests.
# Kept off the default build so `rand` stays out of the production graph.
test-util = ["dep:rand"]

[dev-dependencies]
primitives = { package = "stable_primitives", path = ".", features = ["test-util"] }
bench.workspace = true
sha3.workspace = true

[[bench]]
name = "hash_throughput"
harness = false
