# Written by ../experimental_tiers/generate.sh.
[package]
name = "experimental_dispatch"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
isa.workspace = true
verifier.workspace = true
base = { package = "experimental_lean_vm_core", path = "../experimental_prover/lean_vm_core" }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "avx2", target_feature = "bmi1", target_feature = "bmi2", target_feature = "fma", target_feature = "lzcnt", target_feature = "movbe", target_feature = "f16c", target_feature = "popcnt", target_feature = "pclmulqdq", target_feature = "avx512f", target_feature = "avx512bw", target_feature = "avx512cd", target_feature = "avx512dq", target_feature = "avx512vl", target_feature = "vpclmulqdq", target_feature = "gfni", target_feature = "avx512vbmi"))))'.dependencies]
x86v4gfni = { package = "experimental_lean_vm_core_x86v4gfni", path = "../experimental_tiers/x86v4gfni/experimental_lean_vm_core", optional = true }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "avx2", target_feature = "bmi1", target_feature = "bmi2", target_feature = "fma", target_feature = "lzcnt", target_feature = "movbe", target_feature = "f16c", target_feature = "popcnt", target_feature = "pclmulqdq", target_feature = "vpclmulqdq", target_feature = "gfni"))))'.dependencies]
x86v3gfni = { package = "experimental_lean_vm_core_x86v3gfni", path = "../experimental_tiers/x86v3gfni/experimental_lean_vm_core", optional = true }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "avx2", target_feature = "bmi1", target_feature = "bmi2", target_feature = "fma", target_feature = "lzcnt", target_feature = "movbe", target_feature = "f16c", target_feature = "popcnt", target_feature = "pclmulqdq", target_feature = "vpclmulqdq"))))'.dependencies]
x86v3clmul = { package = "experimental_lean_vm_core_x86v3clmul", path = "../experimental_tiers/x86v3clmul/experimental_lean_vm_core", optional = true }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "avx2", target_feature = "bmi1", target_feature = "bmi2", target_feature = "fma", target_feature = "lzcnt", target_feature = "movbe", target_feature = "f16c", target_feature = "popcnt", target_feature = "pclmulqdq", target_feature = "avx512f", target_feature = "avx512bw", target_feature = "avx512cd", target_feature = "avx512dq", target_feature = "avx512vl"))))'.dependencies]
x86v4 = { package = "experimental_lean_vm_core_x86v4", path = "../experimental_tiers/x86v4/experimental_lean_vm_core", optional = true }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "avx2", target_feature = "pclmulqdq"))))'.dependencies]
x86avx2 = { package = "experimental_lean_vm_core_x86avx2", path = "../experimental_tiers/x86avx2/experimental_lean_vm_core", optional = true }

[target.'cfg(all(target_arch = "aarch64", not(all(target_feature = "aes", target_feature = "sha3"))))'.dependencies]
armsha3 = { package = "experimental_lean_vm_core_armsha3", path = "../experimental_tiers/armsha3/experimental_lean_vm_core", optional = true }

[target.'cfg(all(target_arch = "aarch64", not(all(target_feature = "aes"))))'.dependencies]
armaes = { package = "experimental_lean_vm_core_armaes", path = "../experimental_tiers/armaes/experimental_lean_vm_core", optional = true }

[features]
# The CPU tiers, which only a build with scripts/tier-rustc makes faster.
cpu_tiers = ["dep:x86v4gfni", "dep:x86v3gfni", "dep:x86v3clmul", "dep:x86v4", "dep:x86avx2", "dep:armsha3", "dep:armaes"]

# Named by tiers.rs, which machete does not read.
[package.metadata.cargo-machete]
ignored = ["x86v4gfni", "x86v3gfni", "x86v3clmul", "x86v4", "x86avx2", "armsha3", "armaes"]
