[package]
name = "rec_aggregation"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
isa.workspace = true
verifier.workspace = true
keccak256.workspace = true
lean_compiler.workspace = true
lean_xmss.workspace = true
lean_sphincs.workspace = true
lean_da.workspace = true
rand = { workspace = true, optional = true }
tracing.workspace = true

[features]
# `signers_cache`: cached benchmark signers, for tests and the CLI.
signers-cache = ["dep:rand"]

[dev-dependencies]
rand.workspace = true
# The prover the tests run, and the stable tree's own copies of what the crate restates, to pin it.
stable_leanvm_core = { path = "../stable-prover/leanvm_core" }
stable_pcs = { path = "../stable-prover/pcs" }
