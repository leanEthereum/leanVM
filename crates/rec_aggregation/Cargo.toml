[package]
name = "rec_aggregation"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
primitives.workspace = true
fiat_shamir.workspace = true
parallel.workspace = true
pcs.workspace = true
keccak_gkr.workspace = true
leanvm_core.workspace = true
lean_compiler.workspace = true
signatures.workspace = true
lean_da.workspace = true
verifier.workspace = true
rand = { workspace = true, optional = true }
tracing.workspace = true

[features]
# `signers_cache`: cached benchmark signers over leanXMSS mock keys, for tests and the CLI.
signers-cache = ["signatures/mock", "dep:rand"]
# `aggregation::fuzzing`: forged guest witnesses, forged children and guest runs without a proof, for the fuzzer. Never in a real build.
fuzzing = ["leanvm_core/fuzzing"]

[dev-dependencies]
signatures = { workspace = true, features = ["mock"] }
rand.workspace = true
