[package]
name = "fv_entry"
version.workspace = true
edition.workspace = true
publish = false
description = "The stable prover's aggregation as one function from bytes to bytes, for the proofs about its x86 binary"

[dependencies]
# Without the compiler: the guest is an input.
aggregation = { path = "../aggregation", default-features = false }
isa.workspace = true
lean_xmss.workspace = true
lean_sphincs.workspace = true
stable_lean_vm_core = { path = "../stable_prover/lean_vm_core" }
tracing = { workspace = true, optional = true }
keccak256 = { workspace = true, optional = true }

[features]
# The binary the proofs are about (`formal/x86/build.sh`): every span compiled out, Keccak's backend fixed by the target.
fv = ["dep:tracing", "tracing/max_level_off", "dep:keccak256", "keccak256/static-dispatch"]

[dev-dependencies]
aggregation = { workspace = true, features = ["signers-cache"] }

[lints]
workspace = true

# Named only for their features.
[package.metadata.cargo-machete]
ignored = ["tracing", "keccak256"]
