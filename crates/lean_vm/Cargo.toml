[package]
name = "lean_vm"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
claims.workspace = true
verifier.workspace = true
lean_xmss.workspace = true
lean_sphincs.workspace = true
isa = { workspace = true, optional = true }
aggregation = { workspace = true, optional = true }
lean_da = { workspace = true, optional = true }
stable_lean_vm_core = { path = "../stable_prover/lean_vm_core", optional = true }
experimental_lean_vm_core = { path = "../experimental_prover/lean_vm_core", optional = true }

# The sidecar speaks over a Unix socket.
[target.'cfg(unix)'.dependencies]
sidecar.workspace = true

[features]
default = ["prover"]
# Prove and verify here. Without it, through the sidecar only, and no prover is built.
prover = ["dep:isa", "dep:aggregation", "dep:lean_da", "dep:stable_lean_vm_core"]
# Prove with the experimental tree rather than the stable one.
experimental_prover = ["prover", "dep:experimental_lean_vm_core"]
