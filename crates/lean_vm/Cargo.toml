[package]
name = "lean_vm"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
claims.workspace = true
verifier.workspace = true
lean_xmss.workspace = true
lean_sphincs.workspace = true
lean_vrf.workspace = true
isa.workspace = true
aggregation.workspace = true
lean_da.workspace = true
stable_lean_vm_core = { path = "../stable_prover/lean_vm_core" }
experimental_dispatch = { path = "../experimental_dispatch", optional = true }

[features]
# Prove with the experimental prover rather than the stable one.
experimental_prover = ["dep:experimental_dispatch"]
# The experimental prover once more per CPU tier, run in the fastest the CPU supports: for builds with
# scripts/tier-rustc (crates/experimental_tiers). `cargo vendor` cannot copy the tiers, whose sources lie outside them.
cpu_tiers = ["experimental_prover", "experimental_dispatch/cpu_tiers"]
