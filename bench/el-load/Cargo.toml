[package]
name = "el-load"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: reth stays out of leanVM's.
[workspace]

# reth's stateless validation, as reth's last release with it (v1.10.2) ships it.
[dependencies]
reth-stateless = { git = "https://github.com/paradigmxyz/reth", tag = "v1.10.2" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v1.10.2" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v1.10.2" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.10.2" }
alloy-consensus = "1.4.3"
alloy-primitives = { version = "1.5.0", features = ["k256"] }
alloy-rpc-types-eth = { version = "1.4.3", features = ["serde"] }
alloy-rlp = "0.3.10"
serde_json = "1"

# O_DIRECT, for the database I/O.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
