name = "native"
version = "0.1.0"
defaultTargets = ["Native", "NativeX64", "NativeArm"]

[leanOptions]
warningAsError = true
autoImplicit = false
relaxedAutoImplicit = false

# The statement: leanXMSS's and leanSPHINCS's verification (`Statement/LeanXmss.lean`,
# `Statement/LeanSphincs.lean`), which the verifiers are proved equal to.
[[require]]
name = "statement"
path = "../Statement"

# The proof's wire decoding (`LeanVM.Wire.Encoding`, `Proof.fromBytes`), which the leanVM verifier's
# end theorems decode with; only that module of `lean_vm` is imported.
[[require]]
name = "lean-vm"
path = "../lean_vm"

# Kraken's x86-64 semantics (AeneasVerif/kraken), which the machine code is proved in. Only
# `Kraken.X64.Semantics`, `Kraken.X64.OmniSemantics`, `Kraken.X64.WP`, `Kraken.Mem` and
# `Kraken.X64.PrintATT` are imported: they build on this toolchain, while Kraken's parser targets a
# newer nightly.
[[require]]
name = "Kraken"
git = "https://github.com/AeneasVerif/kraken"
rev = "bf9a5e33ac33cd40cd379121e658fce6f90f18e3"

# Pinned as the statement pins them.
[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "e28da34817c3775cfb935376acf5d416f555d64f"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "5f9baf12d29d25ef7e754765d28030d53e728aac"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "d3ec3a414c233203e2050ed0f33fae8647f57eb7"

# The shared machine (`Native.QM`), its program logic, Keccak-256 and the verifiers, imported by both
# backends; it imports no Kraken module, as Kraken's x86-64 and AArch64 declare the same root names.
[[lean_lib]]
name = "Native"
globs = ["Native.+"]

# The leanVM verifier on the shared machine: its input in memory, its word model, its code and its
# proofs; it imports no Kraken module.
[[lean_lib]]
name = "NativeVm"
globs = ["NativeVm.+"]

# The x86-64 backend: the compiler to Kraken's x86-64 and the verifiers' end theorems there.
[[lean_lib]]
name = "NativeX64"
globs = ["NativeX64", "NativeX64.+"]

# The AArch64 backend: the compiler to Kraken's AArch64 and the verifiers' end theorems there.
[[lean_lib]]
name = "NativeArm"
globs = ["NativeArm", "NativeArm.+"]

# A verifier's x86-64 machine code, `NativeX64.Compile.program body onFail`, printed as an assembly
# file exporting `xmss_verify`, `sphincs_verify` or `leanvm_verify` (cli/EmitX64.lean); `run/check.sh` assembles it
# with the harness.
[[lean_exe]]
name = "emit-x64"
root = "EmitX64"
srcDir = "cli"

# A verifier's AArch64 machine code, `NativeArm.Compile.program body onFail`, printed as an assembly
# file exporting `xmss_verify`, `sphincs_verify` or `leanvm_verify` (cli/EmitArm.lean); `run/check.sh --arch arm`
# assembles it with the harness.
[[lean_exe]]
name = "emit-arm"
root = "EmitArm"
srcDir = "cli"

# The leanVM verifier's word model against the statement's verifier on fixture directories
# (cli/VmModelDiff.lean); not a default target.
[[lean_exe]]
name = "vm-model-diff"
root = "VmModelDiff"
srcDir = "cli"

# The wire decoder's code against `Proof.fromBytes` on fixture directories (cli/WireTest.lean); not a
# default target.
[[lean_exe]]
name = "wire-test"
root = "WireTest"
srcDir = "cli"

# The transcript gadgets and the seed against the statement's `run` on fixture directories
# (cli/VmTranscriptTest.lean); not a default target.
[[lean_exe]]
name = "vm-transcript-test"
root = "VmTranscriptTest"
srcDir = "cli"
