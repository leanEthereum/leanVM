[package]
name = "leanvm-native-vm"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace, outside the repository's: tested with `cargo test --release` here, compiled to
# assembly by `build.sh`.
[workspace]

[lib]
name = "native_vm"
path = "src/lib.rs"

[dev-dependencies]
# The deployed verifier, the reference the tests compare with.
verifier = { path = "../../../../crates/verifier" }

[profile.release]
debug-assertions = false
overflow-checks = false
