# The RV64IM image of the verifier: `crates/verifier` behind an entry that reads its inputs from memory and halts with
# the verdict. Its own workspace: it builds for bare-metal RV64IM only.
[workspace]

[package]
name = "verifier-rv64"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# A `no_std` copy of `crates/verifier`, written by `../scripts/nostd-verifier.sh`.
verifier = { path = "verifier-nostd" }

[profile.release]
opt-level = 2
# Whole-program, so that `dealloc`, a no-op here, is seen to be one and the loops that only drop disappear.
lto = "fat"
codegen-units = 1
# A panic calls the panic handler, which halts with 2. With "immediate-abort" every panic site is an `unimp`, which
# machine-checked's proved lift cannot take.
panic = "abort"
debug = false
