[build]
target = "riscv64im-unknown-none-elf"

[unstable]
build-std = ["core", "alloc"]

# Little inlining (only the smallest functions; the verifier's own functions are fixed by ../boundaries.txt) and no
# runtime or partial unrolling: functions stay functions and loops of variable length stay single loops, while loops of
# constant length unroll fully into straight-line code. No jump or lookup tables (machine-checked's lift has no
# computed jump within a function) and no merging of identical functions (a function's code is its own).
[target.riscv64im-unknown-none-elf]
rustflags = [
  "-C", "llvm-args=-inline-threshold=25",
  "-C", "llvm-args=-unroll-runtime=false",
  "-C", "llvm-args=-unroll-allow-partial=false",
  "-C", "jump-tables=no",
  "-Z", "merge-functions=disabled",
]
