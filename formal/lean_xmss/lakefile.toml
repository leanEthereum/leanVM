name = "lean-xmss-security"
version = "0.1.0"
defaultTargets = ["XmssSecurity"]

[leanOptions]
warningAsError = true
autoImplicit = false
relaxedAutoImplicit = false

# The statement: definitions and end statements only (`Statement/`). leanXMSS is EthLib's, which the
# statement requires: this project proves the statement's leanXMSS theorem from EthLib's.
[[require]]
name = "statement"
path = "../Statement"

# Pinned as the statement pins it, ahead of VCVio's inherited one.
[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "afb9b1363984a70f10e24bd597f6ff40ebc8afbb"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "f1e63c780de398fb62206dd5890f27e1ad64e0e6"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "528b3b1fda285487e55704409bd1b058dc18fcad"

[[lean_lib]]
name = "XmssSecurity"
