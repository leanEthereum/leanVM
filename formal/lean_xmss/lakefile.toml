name = "lean-xmss-security"
version = "0.1.0"
defaultTargets = ["LeanXmss", "XmssSecurity", "XmssSecurity.Tests.QueryBudget"]

[leanOptions]
warningAsError = true

# The statement: definitions and end statements only (`Statement/`).
[[require]]
name = "statement"
path = "../Statement"

# The proofs shared by the projects: the random-permutation model's indifferentiability and
# transfers, the duplex lemma.
[[require]]
name = "common"
path = "../common"

# Pinned as the statement pins it, ahead of VCVio's inherited one.
[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "e28da34817c3775cfb935376acf5d416f555d64f"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "5f9baf12d29d25ef7e754765d28030d53e728aac"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "d3ec3a414c233203e2050ed0f33fae8647f57eb7"

[[lean_lib]]
name = "LeanXmss"

[[lean_lib]]
name = "XmssSecurity"
