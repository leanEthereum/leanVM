name = "quantum"
version = "0.1.0"
defaultTargets = ["Quantum"]

[leanOptions]
warningAsError = true
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

# The statement (`Statement/`): the schemes' definitions the quantum security proofs are about.
[[require]]
name = "statement"
path = "../Statement"

# leanXMSS's deterministic forgery classification (`XmssSecurity.Proof.ForgeryCases`), reused by the
# quantum proof; import that module, never the umbrella `XmssSecurity`.
[[require]]
name = "lean-xmss-security"
path = "../lean_xmss"

# Pinned as the statement pins it, ahead of VCVio's inherited one.
[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "e28da34817c3775cfb935376acf5d416f555d64f"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

# Its quantum oracle programs (`VCVio.Quantum`), at the pin every other project uses.
[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "5f9baf12d29d25ef7e754765d28030d53e728aac"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "d3ec3a414c233203e2050ed0f33fae8647f57eb7"

[[lean_lib]]
name = "Quantum"
