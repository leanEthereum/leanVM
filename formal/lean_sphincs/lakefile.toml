name = "lean-sphincs-security"
version = "0.1.0"
defaultTargets = ["FORS"]

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "cbd4144"

[[lean_lib]]
name = "FORS"
# `FORS.lean` imports every module; `FORS/Axioms.lean` checks their axioms.
roots = ["FORS", "FORS.Axioms"]
# Every module carries the `[Params]` instance (the height, the layers, the FORS shape).
leanOptions = { weak.linter.unusedSectionVars = false }
