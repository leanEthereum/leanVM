# The aggregation guest of leanVM as Lean data, for `Statement/Data/` (the bytecode) and
# `lean_vm/LeanVM/Guest/Data/` (and the test programs, node vectors and guest-diff cases). leanVM no
# longer carries the `LEANVM_WRITE_*` tests that wrote these, so this crate compiles leanVM's
# `aggregation` sources as its own (an overlay: `build.rs` copies them into `OUT_DIR` and
# appends one line declaring `aggregation::lean_export`, this crate's `src/export/`), which lets the
# exporters read the guest's private pieces (`placeholder_map`, `statement_digest`, the batching,
# the hint streams) exactly as the in-tree tests did.
#
# leanVM is this repository (`../../../..`), as for `rust-verifier-cli`; `Cargo.lock` is its. The
# data is generated from this tree.
[package]
name = "leanvm-guest-export"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

# Its own workspace, not a member of leanVM's; leanVM's crates still inherit that one's settings.
# The overlay's sources (`build.rs` copies `aggregation` into `OUT_DIR`) use these, which
# cargo-machete, reading this crate's own sources, cannot see.
[package.metadata.cargo-machete]
ignored = ["fiat_shamir_prover", "isa", "keccak256", "keccak_gkr", "parallel", "pcs", "primitives", "tracing"]

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "guest-export"
path = "src/main.rs"

[dependencies]
# aggregation's own dependencies (crates/aggregation/Cargo.toml), by path and under the same names.
isa = { path = "../../../../crates/isa" }
verifier = { path = "../../../../crates/verifier" }
keccak256 = { path = "../../../../crates/keccak256" }
fiat_shamir_prover = { path = "../../../../crates/fiat_shamir_prover" }
zkdsl_compiler = { path = "../../../../crates/zkdsl_compiler" }
lean_xmss = { path = "../../../../crates/lean_xmss" }
lean_sphincs = { path = "../../../../crates/lean_sphincs" }
lean_da = { path = "../../../../crates/lean_da" }
lean_vm_core = { package = "stable_lean_vm_core", path = "../../../../crates/stable-prover/lean_vm_core" }
parallel = { package = "stable_parallel", path = "../../../../crates/stable-prover/parallel" }
pcs = { package = "stable_pcs", path = "../../../../crates/stable-prover/pcs" }
keccak_gkr = { package = "stable_keccak_gkr", path = "../../../../crates/stable-prover/keccak_gkr" }
primitives = { package = "stable_primitives", path = "../../../../crates/stable-prover/primitives" }
rand = "0.9"
tracing = "0.1.26"

[features]
default = ["signers-cache"]
# aggregation's feature: the cached benchmark signers, for the guest-diff cases.
signers-cache = []

[profile.release]
lto = "thin"
codegen-units = 1
