# The deployed Rust verifier (leanVM `crates/verifier`) on a proof's structured files or its wire
# encoding (`crates/fiat_shamir/src/wire.rs`, `Proof::from_bytes`). The crates are this
# repository's.
[package]
name = "leanvm-rust-verify"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, not a member of leanVM's, whose members still inherit that one's settings.
[workspace]

[dependencies]
verifier = { path = "../../../../crates/verifier" }
fiat_shamir = { path = "../../../../crates/fiat_shamir" }

[profile.release]
codegen-units = 1
