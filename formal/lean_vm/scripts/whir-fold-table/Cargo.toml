# The deployed WHIR fold rounds as Lean data: `lean_vm/LeanVM/Protocol/ToArkLib/Whir/AffineCombinerDeployedTable.lean`,
# from the prover's search (`crates/pcs/src/whir_config.rs`, `derive_config_with_log_inv_rate`) at every admissible
# shape. The crates are this repository's.
[package]
name = "leanvm-whir-fold-table"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, not a member of leanVM's, whose members still inherit that one's settings.
[workspace]

[dependencies]
pcs = { path = "../../../../crates/pcs" }

[profile.release]
codegen-units = 1
