name = "statement"
version = "0.1.0"
defaultTargets = ["Statement"]

[leanOptions]
warningAsError = true
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

# EthLib, the Lean specification of Ethereum. The statement imports its leanXMSS specification
# (`Statement/LeanXmss.lean`), and `lean_xmss` carries EthLib's security theorem to the statement.
# EthLib's VCVio is an older revision than the VCVio required below, and Lake uses the one below.
[[require]]
name = "EthLib"
git = "https://github.com/ethereum/EthLib"
rev = "ab79ab165e984d5f9227150db48719027018bee1"

# PolyFun is VCVio's requirement, pinned at the revision every project of the repository uses.
[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "528b3b1fda285487e55704409bd1b058dc18fcad"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "f1e63c780de398fb62206dd5890f27e1ad64e0e6"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "afb9b1363984a70f10e24bd597f6ff40ebc8afbb"

# Proved `@[csimp]` lemmas that compile `K` and `E` arithmetic on machine words, which
# `Statement.Field` imports so that the statement's definitions are compiled with them.
[[require]]
name = "fast_fields"
path = "../fast_fields"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

# The statement files are `Statement/*.lean` (modules `Statement.<Name>`) and the verifier's pieces
# `Statement/Verifier/*.lean`, the generated guest data `Statement/Data/*.lean`, the proved `@[csimp]` lemmas `Statement/Fast/*.lean` that make the
# compiled Keccak-f fast, and the proofs of the laws the definitions need
# `Statement/Lemmas/*.lean`; the package directory is `Statement/`, so the sources are found from
# its parent.
[[lean_lib]]
name = "Statement"
srcDir = ".."
globs = ["Statement.Keccak", "Statement.RandomPermutation", "Statement.SufCma", "Statement.HashSignatures", "Statement.LeanXmss", "Statement.LeanSphincs",
  "Statement.Field", "Statement.LeanDa", "Statement.LeanIsa", "Statement.LeanVmVerifier",
  "Statement.LeanVm", "Statement.LeanVmGuestBatching", "Statement.LeanVmGuest",
  "Statement.LeanVmGuestProver", "Statement.LeanVmGuestCompleteness", "Statement.CostMachine",
  "Statement.Theorems",
  "Statement.Corollaries",
  "Statement.Verifier.+", "Statement.Data.+", "Statement.Fast.+", "Statement.Lemmas.+", "Statement.Prover.+"]
