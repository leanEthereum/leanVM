[workspace]
members = ["crates/*", "bins/*", "sdk", "programs/*/host"]
# Each guest is its own workspace, for another target. A host depends on its guest's library by path, which
# would make the guest a member: `exclude` takes no globs, so each is named.
exclude = ["programs/leanxmss/guest", "programs/leansphincs/guest", "programs/leanda/guest", "programs/falcon/guest", "programs/stateproof/guest"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"


[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Some pedantic lints
semicolon_if_nothing_returned = "warn"
match_bool = "warn"
needless_pass_by_value = "warn"

redundant_pub_crate = "allow"
too_long_first_doc_paragraph = "allow"
unused_peekable = "allow"
tuple_array_conversions = "allow"
transmute_undefined_repr = "allow"
cognitive_complexity = "allow"

[workspace.dependencies]
bench = { path = "crates/bench" }
leanvm = { path = "crates/leanvm" }
primitives = { path = "crates/primitives" }
fiat_shamir = { path = "crates/fiat_shamir" }
pcs = { path = "crates/pcs" }
flock = { path = "crates/flock" }
leanvm_core = { path = "crates/leanvm_core" }
parallel = { path = "crates/parallel" }
leanvm_guest = { path = "sdk" }
leanxmss-host = { path = "programs/leanxmss/host" }
leansphincs-host = { path = "programs/leansphincs/host" }
leanda-host = { path = "programs/leanda/host" }
falcon-host = { path = "programs/falcon/host" }
stateproof-host = { path = "programs/stateproof/host" }
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
rand = "0.9"
thiserror = { version = "2", default-features = false }
tikv-jemallocator = "0.7"
tracing = "0.1.26"
tracing-forest = { version = "0.3.0", features = ["ansi", "smallvec"] }
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
