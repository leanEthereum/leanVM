[workspace]
members = [
    "crates/verifier",
    "crates/allocator",
    "crates/bench_harness",
    "crates/keccak256",
    "crates/fiat_shamir_prover",
    "crates/isa",
    "crates/zkdsl_compiler",
    "crates/lean_xmss",
    "crates/lean_sphincs",
    "crates/lean_vrf",
    "crates/lean_da",
    "crates/claims",
    "crates/aggregation",
    "crates/lean_vm",
    "crates/sidecar",
    "crates/stable_prover/*",
    "crates/experimental_prover/*",
    "bench",
    "bins/*",
]
# The language bindings are their own workspace (bindings/Cargo.toml).
exclude = ["bindings"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Numeric kernels legitimately index by loop variable and take many arguments.
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"

# With its `sidecar` feature, `lean_vm` still builds its prover, unused; CI's `cargo machete` finds unused dependencies.
[workspace.lints.cargo]
unused_dependencies = "allow"

[workspace.dependencies]
allocator = { path = "crates/allocator" }
bench_harness = { path = "crates/bench_harness" }
verifier = { path = "crates/verifier" }
keccak256 = { path = "crates/keccak256" }
fiat_shamir_prover = { path = "crates/fiat_shamir_prover" }
isa = { path = "crates/isa" }
zkdsl_compiler = { path = "crates/zkdsl_compiler" }
lean_xmss = { path = "crates/lean_xmss" }
lean_sphincs = { path = "crates/lean_sphincs" }
lean_vrf = { path = "crates/lean_vrf" }
lean_da = { path = "crates/lean_da" }
claims = { path = "crates/claims" }
aggregation = { path = "crates/aggregation" }
sidecar = { path = "crates/sidecar" }
libc = "0.2"
rand = "0.9"
sha3 = "0.11"
tikv-jemallocator = "0.7"
tracing = "0.1.26"
tracing-forest = { version = "0.3.0", features = ["ansi", "smallvec"] }
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
