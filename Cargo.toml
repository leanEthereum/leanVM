[workspace]
members = ["crates/*", "bins/*", "sdk", "programs/*/host"]
# Each guest is its own workspace, for another target. A host depends on its guest's library by path, which
# would make the guest a member: `exclude` takes no globs, so each is named.
exclude = ["programs/leanxmss/guest", "programs/leansphincs/guest", "programs/leanda/guest"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"


# Numeric kernels legitimately index by loop variable and take many arguments.
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
bench = { path = "crates/bench" }
leanvm = { path = "crates/leanvm" }
primitives = { path = "crates/primitives" }
fiat_shamir = { path = "crates/fiat_shamir" }
pcs = { path = "crates/pcs" }
flock = { path = "crates/flock" }
leanvm_core = { path = "crates/leanvm_core" }
zk_alloc = { path = "crates/zk_alloc" }
parallel = { path = "crates/parallel" }
leanvm_guest = { path = "sdk" }
leanxmss-host = { path = "programs/leanxmss/host" }
leansphincs-host = { path = "programs/leansphincs/host" }
leanda-host = { path = "programs/leanda/host" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
rand = "0.9"
thiserror = { version = "2", default-features = false }
tracing = "0.1.26"
tracing-forest = { version = "0.3.0", features = ["ansi", "smallvec"] }
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
