[package]
name = "leanvm-fuzz"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "leanvm-fuzz"
path = "src/main.rs"
doc = false

[lints]
workspace = true

[dependencies]
fuzz = { path = "../../crates/fuzz", default-features = false }
verifier.workspace = true
isa.workspace = true
keccak256.workspace = true
primitives = { package = "stable_primitives", path = "../../crates/stable_prover/primitives" }
leanvm_core = { package = "stable_lean_vm_core", path = "../../crates/stable_prover/lean_vm_core" }
exp_leanvm_core = { package = "experimental_lean_vm_core", path = "../../crates/experimental_prover/lean_vm_core" }
clap = { version = "4", features = ["derive"] }

# The target groups, all by default: `--no-default-features --features <group>` builds one alone.
[features]
default = ["kernels", "decoders", "dsl", "isa", "soundness", "aggregation"]
kernels = ["fuzz/kernels"]
decoders = ["fuzz/decoders"]
dsl = ["fuzz/dsl"]
isa = ["fuzz/isa"]
soundness = ["fuzz/soundness"]
aggregation = ["fuzz/aggregation"]