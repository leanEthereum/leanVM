[package]
name = "leanvm-cli"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "leanvm"
path = "src/main.rs"
# A binary, nothing to document.
doc = false

[lints]
workspace = true

[dependencies]
isa.workspace = true
verifier.workspace = true
aggregation = { workspace = true, features = ["signers-cache"] }
lean_da.workspace = true
zkdsl_compiler.workspace = true
lean_xmss.workspace = true
lean_sphincs.workspace = true
stable_leanvm_core = { path = "../../crates/stable-prover/leanvm_core" }
experimental_leanvm_core = { path = "../../crates/experimental-prover/leanvm_core" }
stable_keccak_gkr = { path = "../../crates/stable-prover/keccak_gkr", features = ["bench"] }
experimental_keccak_gkr = { path = "../../crates/experimental-prover/keccak_gkr", features = ["bench"] }
bench.workspace = true
rand.workspace = true
tracing.workspace = true
clap = { version = "4", features = ["derive"] }
