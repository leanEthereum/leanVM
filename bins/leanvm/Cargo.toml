[package]
name = "leanvm-cli"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "leanvm"
path = "src/main.rs"
# Its rustdoc would overwrite the `leanvm` library's (cargo#6313).
doc = false

[lints]
workspace = true

[dependencies]
stable_rec_aggregation = { path = "../../crates/stable/rec_aggregation", features = ["signers-cache"] }
experimental_rec_aggregation = { path = "../../crates/experimental/rec_aggregation", features = ["signers-cache"] }
stable_leanvm_core = { path = "../../crates/stable/leanvm_core" }
experimental_leanvm_core = { path = "../../crates/experimental/leanvm_core" }
stable_parallel = { path = "../../crates/stable/parallel" }
experimental_parallel = { path = "../../crates/experimental/parallel" }
lean_compiler.workspace = true
stable_lean_da = { path = "../../crates/stable/lean_da" }
experimental_lean_da = { path = "../../crates/experimental/lean_da" }
stable_keccak_gkr = { path = "../../crates/stable/keccak_gkr", features = ["bench"] }
experimental_keccak_gkr = { path = "../../crates/experimental/keccak_gkr", features = ["bench"] }
lean_xmss.workspace = true
lean_sphincs.workspace = true
stable_primitives = { path = "../../crates/stable/primitives" }
experimental_primitives = { path = "../../crates/experimental/primitives" }
bench.workspace = true
rand.workspace = true
tracing.workspace = true
clap = { version = "4", features = ["derive"] }
