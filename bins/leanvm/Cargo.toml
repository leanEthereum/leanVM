[package]
name = "leanvm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "leanvm"
path = "src/main.rs"
# Its rustdoc would overwrite the `leanvm` library's (cargo#6313).
doc = false

[lints]
workspace = true

[dependencies]
leanvm.workspace = true
primitives.workspace = true
bench.workspace = true
# The pool's size: a one-thread case is proven in a process of its own.
parallel.workspace = true
leanvm_guest.workspace = true
# The programs' host sides: their guests' inputs and expected outputs.
leanxmss-host.workspace = true
leansphincs-host.workspace = true
falcon-host.workspace = true
stateproof-host.workspace = true
shielded-host.workspace = true
leanda-host.workspace = true
tracing.workspace = true
clap = { version = "4", features = ["derive"] }
# The one-thread cases' benchmarks, merged with this process's.
serde_json = "1"
