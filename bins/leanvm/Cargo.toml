[package]
name = "leanvm-cli"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "leanvm"
path = "src/main.rs"
# Its rustdoc would overwrite the `leanvm` library's (cargo#6313).
doc = false

[lints]
workspace = true

[dependencies]
rec_aggregation.workspace = true
leanvm_core.workspace = true
lean_compiler.workspace = true
lean_da.workspace = true
xmss.workspace = true
sphincs.workspace = true
primitives.workspace = true
bench.workspace = true
rand.workspace = true
bincode.workspace = true
serde.workspace = true
tracing.workspace = true
clap = { version = "4", features = ["derive"] }
